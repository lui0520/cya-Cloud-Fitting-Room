<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f4f3fa" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>小雲試衣間</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <!-- 上方：顯示區（九宮格面板） -->
    <section class="nine-slice stage" id="stage">
      <div class="nine-slice__content stage__inner">
        <!-- 待機：[虛線框] ＋ [雲朵]，把下方選項拖進虛線框 -->
        <div class="stage__idle" id="stage-idle">
          <div class="dropzone" id="dropzone"></div>
          <div class="stage__plus" aria-hidden="true">+</div>
          <img class="stage__cloud" src="img/cloud.png" alt="" draggable="false" />
        </div>

        <!-- 載入中動畫 -->
        <img class="stage__loading" id="stage-loading" src="img/loading.png" alt="" draggable="false" hidden />

        <!-- 結果：選項對應的圖片 -->
        <img class="stage__img" id="stage-img" alt="" draggable="false" hidden />

        <!-- 重新開始：顯示結果後出現，回到待機畫面 -->
        <button class="restart" id="restart" type="button" hidden>↺ 重新開始</button>
      </div>
    </section>

    <!-- 下方：UI 選項區（同一個九宮格面板材質） -->
    <section class="nine-slice panel">
      <div class="nine-slice__content">
        <div id="options" class="options" role="listbox"></div>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
